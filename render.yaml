services:
  - type: web
    name: pathpilot-ai
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir /opt/render/project/src --worker-class gthread --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:\ wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false

{% extends "base.html" %}
{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--neon:#5b6bff;--cyan:#00e5c8;--green:#22c55e;--amber:#ffb547;--red:#ff5757;--glass:rgba(255,255,255,0.028);--font-d:'Syne',sans-serif;--font-b:'DM Sans',sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#000!important;color:#fff!important;font-family:var(--font-b);}
.fd-page{min-height:100vh;background:#000;}
.fd-glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 55% 45% at 5% 10%,rgba(91,107,255,.1) 0%,transparent 65%),radial-gradient(ellipse 45% 40% at 95% 85%,rgba(0,229,200,.07) 0%,transparent 60%);}
.fd-grid{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:60px 60px;}
.fd-body{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:36px 20px 100px;}

.fd-header{text-align:center;margin-bottom:32px;animation:fadeUp .5s ease both;}
.fd-title{font-family:var(--font-d);font-size:clamp(24px,4vw,38px);font-weight:800;letter-spacing:-1.5px;color:#fff;margin-bottom:6px;}
.fd-sub{font-size:15px;color:rgba(255,255,255,.3);font-weight:300;}

.fd-compose{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:20px;margin-bottom:20px;position:relative;overflow:hidden;animation:fadeUp .5s .04s ease both;}
.fd-compose::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(91,107,255,.22),rgba(0,229,200,.12),transparent);}
.fd-compose-row{display:flex;gap:14px;align-items:center;}
.fd-compose-avatar{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,rgba(91,107,255,.35),rgba(0,229,200,.2));display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:16px;font-weight:800;color:#fff;flex-shrink:0;overflow:hidden;}
.fd-compose-input{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:100px;padding:12px 18px;color:rgba(255,255,255,.45);font-family:var(--font-b);font-size:14px;cursor:pointer;transition:all .2s;}
.fd-compose-input:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.15);color:rgba(255,255,255,.7);}
.fd-type-btns{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.05);}
.fd-type-btn{flex:1;padding:8px;border-radius:9px;border:1px solid;font-family:var(--font-b);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .2s;background:none;}

.fd-post{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden;animation:fadeUp .4s ease both;}
.fd-post:hover{border-color:rgba(255,255,255,.12);}
.fd-post-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.fd-post-avatar{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,rgba(91,107,255,.3),rgba(0,229,200,.15));display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:16px;font-weight:800;color:#fff;flex-shrink:0;overflow:hidden;}
.fd-post-avatar img{width:100%;height:100%;object-fit:cover;}
.fd-post-name{font-size:14.5px;font-weight:700;color:#fff;margin-bottom:1px;}
.fd-post-name a{color:inherit;text-decoration:none;}
.fd-post-name a:hover{color:var(--cyan);}
.fd-post-meta{font-size:12px;color:rgba(255,255,255,.28);}
.fd-post-badge{display:inline-flex;padding:2px 10px;border-radius:100px;font-size:10px;font-weight:700;margin-bottom:10px;}
.badge-achievement{background:rgba(255,181,71,.12);border:1px solid rgba(255,181,71,.2);color:var(--amber);}
.badge-milestone{background:rgba(0,229,200,.1);border:1px solid rgba(0,229,200,.2);color:var(--cyan);}
.fd-post-content{font-size:14.5px;color:rgba(255,255,255,.6);line-height:1.78;font-weight:300;white-space:pre-wrap;}
.fd-post-img{width:100%;border-radius:12px;margin-top:12px;max-height:400px;object-fit:cover;border:1px solid rgba(255,255,255,.07);}
.fd-post-actions{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.05);}
.fd-action{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;font-size:13px;color:rgba(255,255,255,.35);cursor:pointer;transition:all .2s;border:1px solid transparent;background:none;}
.fd-action:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.65);border-color:rgba(255,255,255,.08);}
.fd-action.liked{color:var(--red);}

.fd-empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.2);font-size:15px;}
.fd-loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:40px;color:rgba(255,255,255,.3);}
.fd-spin{width:22px;height:22px;border:2px solid rgba(255,255,255,.06);border-top-color:var(--neon);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>

<div class="fd-page">
<div class="fd-glow"></div>
<div class="fd-grid"></div>

<div class="fd-body">
  <div class="fd-header">
    <div class="fd-title">Your Feed 🌐</div>
    <div class="fd-sub">Posts from people you follow</div>
  </div>

  <!-- Compose -->
  <div class="fd-compose">
    <div class="fd-compose-row">
      <div class="fd-compose-avatar" id="myAvatar">?</div>
      <div class="fd-compose-input" onclick="openModal('text')">What's on your mind?</div>
    </div>
    <div class="fd-type-btns">
      <button class="fd-type-btn" style="border-color:rgba(91,107,255,.3);color:#818cf8;" onclick="openModal('text')">📝 Post</button>
      <button class="fd-type-btn" style="border-color:rgba(255,181,71,.2);color:var(--amber);" onclick="openModal('achievement')">🏆 Achievement</button>
      <button class="fd-type-btn" style="border-color:rgba(0,229,200,.2);color:var(--cyan);" onclick="openModal('milestone')">🎯 Milestone</button>
    </div>
  </div>

  <!-- Feed -->
  <div id="feedContainer">
    <div class="fd-loading"><div class="fd-spin"></div> Loading your feed...</div>
  </div>

  <div id="loadMoreWrap" style="text-align:center;display:none;margin-top:8px;">
    <button onclick="loadMore()" style="padding:11px 28px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);font-family:var(--font-b);font-size:13.5px;cursor:pointer;">Load more</button>
  </div>
</div>
</div>

<!-- Post Modal -->
<div id="postModal" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);align-items:center;justify-content:center;">
  <div style="background:#0d0d18;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:32px;width:100%;max-width:520px;margin:20px;position:relative;animation:fadeUp .3s ease both;">
    <div style="font-family:var(--font-d);font-size:19px;font-weight:700;color:#fff;margin-bottom:18px;" id="modalTitle">📝 Create Post</div>
    <textarea id="postContent" placeholder="Share your thoughts, achievements, or milestones..."
      style="width:100%;height:130px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 16px;color:#fff;font-size:14.5px;font-family:var(--font-b);resize:none;outline:none;line-height:1.7;"></textarea>
    <div style="display:flex;gap:10px;margin-top:14px;justify-content:flex-end;">
      <button onclick="closeModal()" style="padding:10px 22px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:transparent;color:rgba(255,255,255,.5);font-family:var(--font-b);font-size:14px;cursor:pointer;">Cancel</button>
      <button onclick="submitPost()" style="padding:10px 26px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--neon),#3a4aff);color:#fff;font-family:var(--font-b);font-size:14px;font-weight:700;cursor:pointer;">Post</button>
    </div>
    <button onclick="closeModal()" style="position:absolute;top:16px;right:18px;background:none;border:none;color:rgba(255,255,255,.3);font-size:22px;cursor:pointer;">×</button>
  </div>
</div>

<script>
let page = 1;
let currentType = 'text';
let myName = '?';
let myImage = null;

// ── Load current user info for avatar ──────────────────────
(async () => {
  try {
    const r = await fetch('/api/profile/me');
    if (!r.ok) return;
    const d = await r.json();
    const av = document.getElementById('myAvatar');
    myName  = d.name || '?';
    myImage = d.image || null;
    if (d.image) {
      av.innerHTML = `<img src="${d.image}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`;
    } else if (d.name) {
      av.textContent = d.name[0].toUpperCase();
    }
  } catch(e) {}
})();

// ── Modal ──────────────────────────────────────────────────
function openModal(type) {
  currentType = type || 'text';
  const titles = { text:'📝 Create Post', achievement:'🏆 Share Achievement', milestone:'🎯 Share Milestone' };
  document.getElementById('modalTitle').textContent = titles[currentType] || '📝 Create Post';
  document.getElementById('postModal').style.display = 'flex';
  setTimeout(() => document.getElementById('postContent').focus(), 100);
}
function closeModal() {
  document.getElementById('postModal').style.display = 'none';
}

// ── Submit post ────────────────────────────────────────────
async function submitPost() {
  const content = document.getElementById('postContent').value.trim();
  if (!content) return;
  const r = await fetch('/api/posts/create', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ content, post_type: currentType })
  });
  const d = await r.json();
  if (d.success) {
    closeModal();
    document.getElementById('postContent').value = '';
    page = 1;
    loadFeed();
  }
}

// ── Render a post card ────────────────────────────────────
function renderPost(p) {
  const initials = p.user_name ? p.user_name[0].toUpperCase() : '?';
  const avatar   = p.user_image
    ? `<img src="${p.user_image}" style="width:100%;height:100%;object-fit:cover;">`
    : initials;
  const badgeHtml = p.post_type === 'achievement'
    ? '<div class="fd-post-badge badge-achievement">🏆 Achievement</div>'
    : p.post_type === 'milestone'
    ? '<div class="fd-post-badge badge-milestone">🎯 Milestone</div>'
    : '';
  const imgHtml = p.image_url
    ? `<img class="fd-post-img" src="${p.image_url}" alt="post image">`
    : '';
  return `
    <div class="fd-post" id="post-${p.id}">
      <div class="fd-post-header">
        <div class="fd-post-avatar">${avatar}</div>
        <div>
          <div class="fd-post-name"><a href="/profile/${p.user_id}">${escHtml(p.user_name || 'User')}</a></div>
          <div class="fd-post-meta">${p.headline ? escHtml(p.headline) + ' · ' : ''}${p.created_at || ''}</div>
        </div>
      </div>
      ${badgeHtml}
      <div class="fd-post-content">${escHtml(p.content)}</div>
      ${imgHtml}
      <div class="fd-post-actions">
        <button class="fd-action ${p.liked ? 'liked' : ''}" onclick="toggleLike(${p.id}, this)">
          ${p.liked ? '♥' : '♡'} <span id="likes-${p.id}">${p.likes}</span>
        </button>
        <button class="fd-action" onclick="window.location='/profile/${p.user_id}'">
          💬 Comment
        </button>
      </div>
    </div>`;
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Load feed ─────────────────────────────────────────────
async function loadFeed() {
  const container = document.getElementById('feedContainer');
  if (page === 1) {
    container.innerHTML = '<div class="fd-loading"><div class="fd-spin"></div> Loading...</div>';
  }
  try {
    const r     = await fetch(`/api/posts/feed?page=${page}`);
    if (!r.ok) {
      container.innerHTML = '<div class="fd-empty">Could not load feed. Please refresh.</div>';
      return;
    }
    const posts = await r.json();
    if (page === 1) container.innerHTML = '';
    if (!Array.isArray(posts) || (!posts.length && page === 1)) {
      container.innerHTML = `
        <div class="fd-empty">
          Your feed is empty.<br>
          Follow people to see their posts here!<br><br>
          <a href="/search" style="color:var(--cyan);text-decoration:none;">Find People to Follow →</a>
        </div>`;
      return;
    }
    posts.forEach(p => { container.innerHTML += renderPost(p); });
    document.getElementById('loadMoreWrap').style.display = posts.length >= 10 ? 'block' : 'none';
  } catch(e) {
    container.innerHTML = '<div class="fd-empty">Could not load feed.</div>';
  }
}

function loadMore() { page++; loadFeed(); }

// ── Like toggle ───────────────────────────────────────────
async function toggleLike(postId, el) {
  try {
    const r = await fetch(`/api/posts/like/${postId}`, { method: 'POST' });
    const d = await r.json();
    if (d.success) {
      el.classList.toggle('liked', d.liked);
      el.innerHTML = `${d.liked ? '♥' : '♡'} <span id="likes-${postId}">${d.count || d.likes || 0}</span>`;
    }
  } catch(e) {}
}

// ── Start ─────────────────────────────────────────────────
loadFeed();
</script>
{% endblock %}

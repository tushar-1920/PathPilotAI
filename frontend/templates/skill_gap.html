{% extends "base.html" %}
{% block content %}

<h2>🧠 AI Skill Gap Analyzer</h2>

<div class="card-glass p-4 mt-4">

    <input id="roleInput" class="form-control"
           placeholder="Enter role (e.g., Data Scientist)">

    <button class="btn btn-info mt-3"
            onclick="analyzeGap()">
        Analyze
    </button>

</div>

<div id="resultBox" class="mt-4"></div>

<script>
async function analyzeGap() {

    const role = document.getElementById("roleInput").value;

    const res = await fetch("/api/skill-gap", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({role: role})
    });

    const data = await res.json();

    const box = document.getElementById("resultBox");

    box.innerHTML = `
        <div class="card-glass p-4">
            <h4>Match: ${data.match_percent}%</h4>
            <h5 class="mt-3">Missing Skills:</h5>
            <p>${data.missing_skills.join(", ")}</p>
        </div>
    `;
}
</script>

{% endblock %}

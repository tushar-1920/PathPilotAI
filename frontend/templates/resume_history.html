{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">📂 Resume History</h2>

<div class="card-glass p-4">

    <table class="table table-dark table-hover align-middle">
        <thead>
            <tr>
                <th>File</th>
                <th>Uploaded</th>
                <th>Skill Score</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="resumeTable"></tbody>
    </table>

</div>

<script>
async function loadHistory() {

    const res = await fetch("/api/resume-history");
    const data = await res.json();

    const table = document.getElementById("resumeTable");
    table.innerHTML = "";

    if (!data.length) {
        table.innerHTML = "<tr><td colspan='4'>No resumes uploaded yet.</td></tr>";
        return;
    }

    data.forEach(r => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${r.filename}</td>
            <td>${r.uploaded_at}</td>
            <td>
                <div class="progress">
                    <div class="progress-bar bg-success"
                        style="width:${r.skill_score}%">
                        ${r.skill_score}%
                    </div>
                </div>
            </td>
            <td>
                <button class="btn btn-sm btn-outline-info"
                    onclick="compareResumes()">
                    Compare
                </button>
            </td>
        `;

        table.appendChild(row);
    });
}

async function compareResumes() {

    const res = await fetch("/api/resume-compare");
    const data = await res.json();

    alert(
        "Added Skills: " + data.added.join(", ") +
        "\nRemoved Skills: " + data.removed.join(", ")
    );
}

loadHistory();
</script>

{% endblock %}

\{% extends "base.html" %}
{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--neon:#5b6bff;--cyan:#00e5c8;--green:#22c55e;--font-d:"Syne",sans-serif;--font-b:"DM Sans",sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#000!important;color:#fff!important;font-family:var(--font-b);}
.su-page{min-height:100vh;background:#000;position:relative;}
.su-glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 50% 40% at 50% 10%,rgba(91,107,255,.1) 0%,transparent 65%);}
.su-grid{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:60px 60px;}
.su-body{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:48px 20px 100px;}
.su-title{font-family:var(--font-d);font-size:clamp(24px,4vw,36px);font-weight:800;letter-spacing:-1.5px;color:#fff;margin-bottom:8px;}
.su-sub{font-size:14.5px;color:rgba(255,255,255,.3);margin-bottom:28px;}
.su-search-wrap{position:relative;margin-bottom:28px;}
.su-search-inp{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px 20px 16px 48px;color:#fff;font-family:var(--font-b);font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s;}
.su-search-inp:focus{border-color:rgba(91,107,255,.5);box-shadow:0 0 0 3px rgba(91,107,255,.1);}
.su-search-inp::placeholder{color:rgba(255,255,255,.2);}
.su-search-icon{position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:17px;pointer-events:none;}
.su-user-card{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:16px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);margin-bottom:10px;transition:all .2s;animation:fadeUp .4s ease both;}
.su-user-card:hover{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.14);transform:translateY(-2px);}
.su-av{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,rgba(91,107,255,.35),rgba(0,229,200,.2));display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:20px;font-weight:800;color:#fff;flex-shrink:0;overflow:hidden;}
.su-av img{width:100%;height:100%;object-fit:cover;}
.su-name{font-family:var(--font-d);font-size:17px;font-weight:700;color:#fff;letter-spacing:-.3px;margin-bottom:2px;}
.su-username{font-size:12.5px;color:rgba(0,229,200,.7);margin-bottom:3px;}
.su-headline{font-size:13px;color:rgba(255,255,255,.35);}
.su-actions{display:flex;gap:8px;margin-left:auto;flex-shrink:0;}
.su-follow-btn{padding:8px 18px;border-radius:9px;border:1px solid rgba(91,107,255,.3);background:rgba(91,107,255,.08);color:#818cf8;font-family:var(--font-b);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
.su-follow-btn:hover{background:rgba(91,107,255,.18);}
.su-follow-btn.following{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:rgba(255,255,255,.45);}
.su-view-btn{padding:8px 16px;border-radius:9px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);font-family:var(--font-b);font-size:13px;text-decoration:none;transition:all .2s;}
.su-view-btn:hover{background:rgba(255,255,255,.09);color:#fff;}
.su-empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.2);}
.su-loading{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.3);padding:20px 0;}
.su-spin{width:20px;height:20px;border:2px solid rgba(255,255,255,.06);border-top-color:var(--neon);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>

<div class="su-page">
<div class="su-glow"></div>
<div class="su-grid"></div>
<div class="su-body">

  <div class="su-title">🔍 Find People</div>
  <div class="su-sub">Search by name or @username to find and connect</div>

  <div class="su-search-wrap">
    <div class="su-search-icon">🔍</div>
    <input class="su-search-inp" id="searchInp" placeholder="Search by name or @username..."
           value="{{ q }}" oninput="search(this.value)" autofocus>
  </div>

  <div id="results">
    {% if not q %}
    <div class="su-empty">Start typing to search for people on PathPilot</div>
    {% endif %}
  </div>

</div>
</div>

<script>
const ME = parseInt("{{ session.get('user_id', 0) }}") || 0;
let searchTimer;

function search(q) {
  clearTimeout(searchTimer);
  const res = document.getElementById("results");
  if (!q.trim()) { res.innerHTML = `<div class="su-empty">Start typing to search for people</div>`; return; }
  res.innerHTML = `<div class="su-loading"><div class="su-spin"></div> Searching for "${q}"...</div>`;
  searchTimer = setTimeout(async () => {
    const data = await fetch(`/api/users/search?q=${encodeURIComponent(q)}`).then(r=>r.json());
    if (!data.length) { res.innerHTML = `<div class="su-empty">No users found for "<strong style="color:#fff">${q}</strong>"</div>`; return; }
    res.innerHTML = data.map((u, i) => {
      const av = u.image ? `<img src="${u.image}">` : (u.name?u.name[0].toUpperCase():"?");
      const uname = u.username ? `<div class="su-username">@${u.username}</div>` : "";
      const followBtn = u.id === ME ? "" : u.is_following
        ? `<button class="su-follow-btn following" onclick="unfollow(${u.id},this)">✓ Following</button>`
        : `<button class="su-follow-btn" onclick="follow(${u.id},this)">+ Follow</button>`;
      return `<div class="su-user-card" style="animation-delay:${i*0.06}s">
        <div class="su-av">${av}</div>
        <div style="flex:1;min-width:0">${uname}<div class="su-name">${u.name}</div><div class="su-headline">${u.headline||""}</div></div>
        <div class="su-actions">
          ${followBtn}
          <a href="/profile/${u.id}" class="su-view-btn">View</a>
        </div>
      </div>`;
    }).join("");
  }, 280);
}

async function follow(userId, btn) {
  const d = await fetch(`/api/follow/${userId}`,{method:"POST"}).then(r=>r.json());
  if (d.success) { btn.textContent = "✓ Following"; btn.classList.add("following"); btn.onclick = () => unfollow(userId, btn); }
}
async function unfollow(userId, btn) {
  const d = await fetch(`/api/unfollow/${userId}`,{method:"POST"}).then(r=>r.json());
  if (d.success) { btn.textContent = "+ Follow"; btn.classList.remove("following"); btn.onclick = () => follow(userId, btn); }
}

// Auto search if q is present
const initQ = document.getElementById("searchInp").value;
if (initQ) search(initQ);
</script>
{% endblock %}

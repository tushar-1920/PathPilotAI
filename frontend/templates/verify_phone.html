{% extends "base.html" %}
{% block content %}

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .vp-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0f;
    font-family: 'DM Sans', sans-serif;
  }

  .vp-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 440px;
    text-align: center;
  }

  .vp-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }

  .vp-title {
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 8px;
  }

  .vp-sub {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 32px;
    line-height: 1.6;
  }

  .vp-input {
    width: 100%;
    padding: 14px 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    color: #fff;
    font-size: 15px;
    margin-bottom: 14px;
    outline: none;
    transition: border 0.2s;
  }

  .vp-input:focus {
    border-color: #5b6bff;
  }

  .vp-input::placeholder {
    color: rgba(255,255,255,0.3);
  }

  .vp-btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 12px;
  }

  .vp-btn-primary {
    background: linear-gradient(135deg, #5b6bff, #3a4dff);
    color: #fff;
    box-shadow: 0 8px 32px rgba(91,107,255,0.4);
  }

  .vp-btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 42px rgba(91,107,255,0.55);
  }

  .vp-btn-secondary {
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .vp-btn-secondary:hover {
    background: rgba(255,255,255,0.09);
  }

  .vp-msg {
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
    display: none;
  }

  .vp-msg.error {
    background: rgba(255,80,80,0.12);
    color: #ff6b6b;
    border: 1px solid rgba(255,80,80,0.2);
    display: block;
  }

  .vp-msg.success {
    background: rgba(29,158,117,0.12);
    color: #1D9E75;
    border: 1px solid rgba(29,158,117,0.2);
    display: block;
  }

  .vp-skip {
    margin-top: 20px;
    font-size: 13px;
    color: rgba(255,255,255,0.3);
  }

  .vp-skip a {
    color: rgba(255,255,255,0.5);
    text-decoration: underline;
    cursor: pointer;
  }

  #step-otp { display: none; }

  /* Recaptcha hide */
  #recaptcha-container { margin: 12px 0; }
</style>

<div class="vp-wrap">
  <div class="vp-card">
    <div class="vp-icon">📱</div>
    <div class="vp-title">Verify Your Phone</div>
    <div class="vp-sub">We'll send a 6-digit OTP to your number.<br>This keeps your account secure.</div>

    <div id="msg" class="vp-msg"></div>

    <!-- Step 1: Enter phone -->
    <div id="step-phone">
      <input type="tel" id="phone-input" class="vp-input"
             placeholder="+91 98765 43210" maxlength="15"/>
      <div id="recaptcha-container"></div>
      <button class="vp-btn vp-btn-primary" onclick="sendOTP()">Send OTP</button>
    </div>

    <!-- Step 2: Enter OTP -->
    <div id="step-otp">
      <p style="color:rgba(255,255,255,0.5);font-size:13px;margin-bottom:14px;">
        OTP sent to <span id="phone-display" style="color:#fff;"></span>
      </p>
      <input type="text" id="otp-input" class="vp-input"
             placeholder="Enter 6-digit OTP" maxlength="6"/>
      <button class="vp-btn vp-btn-primary" onclick="verifyOTP()">Verify & Continue</button>
      <button class="vp-btn vp-btn-secondary" onclick="resetToPhone()">Change Number</button>
    </div>

    <div class="vp-skip">
      <a onclick="skipVerification()">Skip for now →</a>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAFzJ5bpG3DBFAoKUCBxJ5UTOOsQyrr9c8",
  authDomain: "pathpilot-f5937.firebaseapp.com",
  projectId: "pathpilot-f5937",
  storageBucket: "pathpilot-f5937.firebasestorage.app",
  messagingSenderId: "717751369641",
  appId: "1:717751369641:web:6563ed8dd5a58473eaceb8"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);

let confirmationResult = null;

function showMsg(text, type) {
  const el = document.getElementById("msg");
  el.textContent = text;
  el.className = "vp-msg " + type;
}

window.sendOTP = async function() {
  const phone = document.getElementById("phone-input").value.trim();
  if (!phone || phone.length < 10) {
    showMsg("Please enter a valid phone number with country code (e.g. +91...)", "error");
    return;
  }

  try {
    showMsg("Sending OTP...", "success");

    try {
      if (window.recaptchaVerifier) {
        window.recaptchaVerifier.clear();
        window.recaptchaVerifier = null;
      }
    } catch(e) {}

    window.recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", {
      size: "invisible",
      callback: () => {}
    });

    confirmationResult = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);

    document.getElementById("step-phone").style.display = "none";
    document.getElementById("step-otp").style.display   = "block";
    document.getElementById("phone-display").textContent = phone;
    showMsg("OTP sent successfully!", "success");

  } catch (err) {
    console.error(err);
    showMsg("Failed to send OTP: " + err.message, "error");
    if (window.recaptchaVerifier) {
      window.recaptchaVerifier.clear();
      window.recaptchaVerifier = null;
    }
  }
};

window.verifyOTP = async function() {
  const otp = document.getElementById("otp-input").value.trim();
  if (!otp || otp.length !== 6) {
    showMsg("Please enter the 6-digit OTP", "error");
    return;
  }

  try {
    showMsg("Verifying...", "success");
    const result  = await confirmationResult.confirm(otp);
    const idToken = await result.user.getIdToken();

    const res  = await fetch("/verify-phone", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ idToken })
    });
    const data = await res.json();

    if (data.success) {
      showMsg("✅ Phone verified! Redirecting...", "success");
      setTimeout(() => window.location.href = data.redirect, 1000);
    } else {
      showMsg("Verification failed: " + data.error, "error");
    }
  } catch (err) {
    console.error(err);
    showMsg("Wrong OTP. Please try again.", "error");
  }
};

window.resetToPhone = function() {
  document.getElementById("step-phone").style.display = "block";
  document.getElementById("step-otp").style.display   = "none";
  document.getElementById("msg").className = "vp-msg";
  if (window.recaptchaVerifier) {
    window.recaptchaVerifier.clear();
    window.recaptchaVerifier = null;
  }
};

window.skipVerification = async function() {
  await fetch("/verify-phone/skip", { method: "POST" });
  window.location.href = "/dashboard";
};
</script>

{% endblock %}
